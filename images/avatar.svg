<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#00C2FF"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00C2FF;stop-opacity:0.1"/>
      <stop offset="50%" style="stop-color:#00C2FF;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#00C2FF;stop-opacity:0.1"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" rx="40" fill="url(#bg)"/>
  <!-- Grid dots -->
  <g opacity="0.08" fill="#CBD5E1">
    <circle cx="20" cy="20" r="1"/><circle cx="60" cy="20" r="1"/><circle cx="100" cy="20" r="1"/><circle cx="140" cy="20" r="1"/><circle cx="180" cy="20" r="1"/>
    <circle cx="20" cy="60" r="1"/><circle cx="60" cy="60" r="1"/><circle cx="100" cy="60" r="1"/><circle cx="140" cy="60" r="1"/><circle cx="180" cy="60" r="1"/>
    <circle cx="20" cy="100" r="1"/><circle cx="60" cy="100" r="1"/><circle cx="100" cy="100" r="1"/><circle cx="140" cy="100" r="1"/><circle cx="180" cy="100" r="1"/>
    <circle cx="20" cy="140" r="1"/><circle cx="60" cy="140" r="1"/><circle cx="100" cy="140" r="1"/><circle cx="140" cy="140" r="1"/><circle cx="180" cy="140" r="1"/>
    <circle cx="20" cy="180" r="1"/><circle cx="60" cy="180" r="1"/><circle cx="100" cy="180" r="1"/><circle cx="140" cy="180" r="1"/><circle cx="180" cy="180" r="1"/>
  </g>
  <!-- Orbit rings -->
  <ellipse cx="100" cy="100" rx="70" ry="30" fill="none" stroke="url(#orbit)" stroke-width="1.5" transform="rotate(-25 100 100)"/>
  <ellipse cx="100" cy="100" rx="55" ry="22" fill="none" stroke="url(#orbit)" stroke-width="1" transform="rotate(15 100 100)" opacity="0.5"/>
  <!-- Satellite dot -->
  <circle cx="155" cy="82" r="4" fill="#00C2FF">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="12s" repeatCount="indefinite"/>
  </circle>
  <!-- Center: stylized "L" monogram -->
  <text x="100" y="118" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="64" font-weight="700" fill="url(#accent)" opacity="0.9">L</text>
  <!-- Subtle glow behind text -->
  <circle cx="100" cy="100" r="35" fill="#00C2FF" opacity="0.05"/>
</svg>
