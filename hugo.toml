baseURL = "https://liyujun.github.io/"
languageCode = "zh-cn"
title = "煜哥的博客"
theme = "PaperMod"
[pagination]
  pagerSize = 10

[params]
  env = "production"
  description = "遥感 · AI · 全栈开发"
  author = "李俊昊"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  comments = false

  [params.homeInfoParams]
    Title = "👋 你好，我是煜哥"
    Content = "遥感工程师 · AI 全栈开发者 · 记录技术与生活"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/rsliyu"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 30

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    style = "dracula"
    lineNos = false
